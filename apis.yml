aid: glyphic-biotechnologies
name: Glyphic Biotechnologies
description: Glyphic Biotechnologies is a Berkeley, California proteomics company founded in 2021 that
  is developing ProSE (Protein Sequencing by Expansion) — a de novo, high-throughput, single-molecule
  protein sequencing technology designed to discriminate all 20 amino acids and their post-translational
  modifications. The company aims to make massively parallel proteome sequencing broadly accessible for
  drug discovery and biological research, and is backed by Wing Venture Capital. Glyphic currently
  publishes no public developer API, SDKs, or documentation surface; this profile captures its identity
  and domain-security posture in the API Evangelist network.
